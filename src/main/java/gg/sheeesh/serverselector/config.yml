# ServerSelector config
max-servers: 100          # servers EACH player can add for themselves
transfer-countdown: 3     # seconds before joining (0 = instant). Moving cancels it.
edit-tag: edit            # players with this tag AND in creative can edit sign text (sneak + click opens the menu)

# Recommended servers: shown to everyone at the top, can't be edited/deleted.
# Java players use java-port, Bedrock players use bedrock-port.
# Leave one out and that edition won't see the server.
recommended:
  - name: WorldSMP
    host: randomserver123.mcsh.gg
    java-port: 25565
    bedrock-port: 19132
    icon: textures/items/nether_star

# Icons for Bedrock players: "Label|texture path". Add your own lines!
# (Java players see the matching item automatically, compass if there's no match.)
